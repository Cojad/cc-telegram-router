# The static bubblewrap the router runs every claude command with in managed mode
# (docs/managed-channel.md, router/toolbox.ts HOST_TOOLS). Run by hand: it builds
# bubblewrap from the upstream release tarball (sha256 checked) in a pinned Alpine
# image (musl, libcap static) and uploads it to this repo's release as
# bwrap-<version>-x86_64, printing its sha256 for HOST_TOOLS. `apk add` takes the
# Alpine branch's current packages, so a later run may give another sha256; the
# router pins whatever the release holds.
name: bwrap-static
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload to (created when missing)
        default: bwrap-0.13.1
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Build static bwrap in Alpine
        run: |
          set -eux
          VER=0.13.1
          SHA=0e85c8702248b8dd64144f594147553650cdd0e4c951690345faace79c217c4d
          IMG=alpine:3@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          mkdir -p work/src work/out
          curl -fL -o work/bubblewrap.tar.xz "https://github.com/containers/bubblewrap/releases/download/v$VER/bubblewrap-$VER.tar.xz"
          echo "$SHA  work/bubblewrap.tar.xz" | sha256sum -c -
          tar -C work/src -xJf work/bubblewrap.tar.xz
          docker run --rm --cpus 2 -v "$PWD/work:/work" -e VER="$VER" -e OUT_UID="$(id -u)" -e OUT_GID="$(id -g)" "$IMG" sh -euxc '
            apk add --no-cache build-base meson ninja pkgconf libcap-dev libcap-static linux-headers
            cd "/work/src/bubblewrap-$VER"
            meson setup /tmp/b --buildtype=release --default-library=static --prefer-static \
              -Db_lto=false -Dc_link_args=-static -Dselinux=disabled -Dman=disabled -Dtests=false \
              -Dbash_completion=disabled -Dzsh_completion=disabled
            ninja -C /tmp/b -j2
            cp /tmp/b/bwrap /work/out/bwrap
            strip /work/out/bwrap
            chown "$OUT_UID:$OUT_GID" /work/out/bwrap'
          file work/out/bwrap
          ldd work/out/bwrap || true
          work/out/bwrap --version
          cp work/out/bwrap "work/out/bwrap-$VER-x86_64"
          sha256sum "work/out/bwrap-$VER-x86_64" | tee work/out/SHA256SUMS
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eux
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "Static bubblewrap for cc-telegram-router's managed mode (docs/managed-channel.md). Built by .github/workflows/bwrap-static.yml."
          gh release upload "$TAG" work/out/bwrap-0.13.1-x86_64 work/out/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          cat work/out/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bwrap-static-0.13.1
          path: work/out/bwrap-0.13.1-x86_64
